name: Weekly SEO Monitor

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 7am UTC
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crawl sitemap URLs (status + canonical)
        run: |
          set -e
          # The live sitemap must be valid XML with at least one <loc> — catches the
          # "Sitemap is HTML" failure mode where a page gets served where XML is expected.
          live=$(mktemp)
          sc=$(curl -s -o "$live" -w "%{http_code}" --max-time 20 https://mydoublecheck.app/sitemap.xml || echo 000)
          if [ "$sc" != "200" ] || ! head -1 "$live" | grep -q "<?xml"; then
            echo "::error::live sitemap.xml is not valid XML (status $sc, first line not <?xml) — it may be served as HTML"
            fail=1
          fi
          locs=$(grep -c "<loc>" "$live" || echo 0)
          [ "$locs" -gt 0 ] || { echo "::error::live sitemap.xml has zero <loc> entries"; fail=1; }
          rm -f "$live"

          grep "<loc>" sitemap.xml | sed 's/.*<loc>//;s/<\/loc>.*//' > /tmp/urls.txt
          echo "Checking $(wc -l < /tmp/urls.txt) URLs"
          fail=0
          while read -r url; do
            tmp=$(mktemp)
            code=$(curl -s -L -o "$tmp" -w "%{http_code}" --max-time 20 "$url" || echo "000")
            # Pull the canonical href and require it to be self-referential.
            canon=$(grep -o '<link[^>]*rel="canonical"[^>]*>' "$tmp" | head -1 || true)
            href=$(printf '%s' "$canon" | grep -o 'href="[^"]*"' | sed 's/href="//;s/"//' || true)
            if [ "$code" != "200" ]; then
              echo "::error::$url returned $code (must be 200 — remove from sitemap or fix)"
              fail=1
            elif [ -z "$canon" ]; then
              echo "::warning::$url has no canonical tag"
            elif [ -n "$href" ] && [ "${href%/}" != "${url%/}" ]; then
              echo "::error::$url canonical points elsewhere: $href (must self-canonicalize)"
              fail=1
            fi
            rm -f "$tmp"
          done < /tmp/urls.txt

          # Duplicate hosts must permanently redirect to the canonical domain
          for host in doublecheck-landing.vercel.app www.mydoublecheck.app; do
            vcode=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://$host/" || echo "000")
            if [ "$vcode" != "308" ] && [ "$vcode" != "301" ]; then
              echo "::error::$host returned $vcode — expected a permanent redirect to mydoublecheck.app"
              fail=1
            fi
          done

          # robots.txt and llms.txt must be reachable
          for f in robots.txt llms.txt sitemap.xml; do
            c=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://mydoublecheck.app/$f")
            [ "$c" = "200" ] || { echo "::error::/$f returned $c"; fail=1; }
          done

          exit $fail
